name = "vetrehab-gate"
main = "worker/src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

routes = [
  { pattern = "vetrehab.cr", custom_domain = true },
  { pattern = "www.vetrehab.cr", custom_domain = true },
]

# GATE = "on" keeps the basic-auth preview gate and the X-Robots-Tag header.
# tools/launch.py flips it together with the robots meta and robots.txt.
[vars]
GATE = "on"

# GATE_USER / GATE_PASS are set with:
#   wrangler secret put GATE_USER
#   wrangler secret put GATE_PASS

# The static site is served by the Worker itself, so there is no public
# origin URL sitting outside the password gate.
[assets]
directory = "site"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
